<div class="p-4">
  <h1 class="text-xl font-bold mb-4">Administración de SLAs</h1>

  <div class="mb-4">
    <button (click)="abrirFormularioCreacion()" class="px-4 py-2 bg-blue-600 text-white rounded-md">
      Crear SLA
    </button>
  </div>

  <div class="overflow-hidden shadow-sm border border-gray-200 rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Nombre</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Tiempo Cliente
            (hora)</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Tiempo Sistema
            (hora)</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Creado</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Modificado</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-center align-middle">Acciones</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let sla of slas" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-900 text-center align-middle">{{ sla.nombre }}</td>
          <td class="px-6 py-4 text-sm text-gray-500 text-center align-middle">{{ sla.tiempo_cliente }}</td>
          <td class="px-6 py-4 text-sm text-gray-500 text-center align-middle">{{ sla.tiempo_sistema }}</td>
          <td class="px-6 py-4 text-sm text-gray-500 text-center align-middle">{{ sla.created_at | date:'short' }}</td>
          <td class="px-6 py-4 text-sm text-gray-500 text-center align-middle">{{ sla.updated_at | date:'short' }}</td>
          <td class="px-6 py-4 text-sm font-medium flex space-x-4">
            <button (click)="abrirFormularioEdicion(sla)" class="text-indigo-600 hover:text-indigo-900">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
              </svg>
            </button>
            <button (click)="eliminarSla(sla.id)" class="text-red-600 hover:text-red-900">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal SLA -->
  <div *ngIf="slaEdicion" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold mb-4">{{ slaEdicion.id ? 'Editar SLA' : 'Crear SLA' }}</h2>
      <form (ngSubmit)="guardarSla()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Nombre</label>
          <input [(ngModel)]="slaEdicion.nombre" name="nombre"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tiempo para Cliente (min)</label>
          <input type="number" [(ngModel)]="slaEdicion.tiempo_cliente" name="tiempo_cliente"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700">Tiempo SLA del Sistema (min)</label>
          <input type="number" [(ngModel)]="slaEdicion.tiempo_sistema" name="tiempo_sistema"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required />
        </div>
        <div class="flex justify-end space-x-4">
          <button type="button" (click)="cancelarFormulario()"
            class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">Cancelar</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">
            {{ slaEdicion.id ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
