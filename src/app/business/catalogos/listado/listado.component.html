<div class="p-4">

  <div class="py-6 pt-4">
    <div class="flex items-center justify-between mb-6 border-b pb-4">
      <h2 class="text-2xl font-semibold text-gray-800 mt-0">Administración de Catálogos</h2>
    </div>
  
  <div class="flex justify-end mb-4">
    <button (click)="abrirModalCreacion()" class="px-4 py-2 bg-blue-600 text-white rounded-md">
      + Nuevo Catálogo
    </button>
  </div>

    <div class="overflow-hidden shadow-sm border border-gray-200 rounded-lg">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Campo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let catalogo of catalogos" class="hover:bg-gray-50">
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ catalogo.nombre }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ catalogo.descripcion }}</td>
            <td class="px-6 py-4 text-sm text-gray-500">{{ catalogo.tipificacion?.nombre || 'Sin tipificación' }}</td>
            <td class="px-6 py-4 text-sm font-medium flex space-x-4">
              <button (click)="abrirFormularioEdicion(catalogo)" class="text-indigo-600 hover:text-indigo-900">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                </svg>
              </button>
              <button class="text-red-600 hover:text-red-900" (click)="eliminarCatalogo(catalogo.id)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal para crear catálogo -->
<div *ngIf="mostrarModalCreacion" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50">
  <div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-4">Crear Catálogo</h2>
    <form (ngSubmit)="crearCatalogo()">
      <!-- Nombre -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" [(ngModel)]="nuevoCatalogo.nombre" name="nombreNuevo" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" />
      </div>
      <!-- Descripción -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Descripción</label>
        <textarea [(ngModel)]="nuevoCatalogo.descripcion" name="descripcionNuevo" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></textarea>
      </div>
      <!-- Tipificación -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Tipificación</label>
        <select [(ngModel)]="nuevoCatalogo.tipificacion_id" name="tipificacionNuevo" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
          <option *ngFor="let tip of tipificaciones" [value]="tip.id">{{ tip.nombre }}</option>
        </select>
      </div>
      <!-- Botones -->
      <div class="flex justify-end space-x-4">
        <button type="button" (click)="cerrarModalCreacion()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Crear</button>
      </div>
    </form>
  </div>
</div>
  
  <!-- Modal para editar catálogo -->
<div *ngIf="mostrarModal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-800 bg-opacity-50">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      <h2 class="text-2xl font-bold mb-4">Editar Catálogo</h2>
      <form (ngSubmit)="actualizarCatalogo()">
        <!-- Nombre -->
        <div class="mb-4">
          <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
          <input type="text" id="nombre" [(ngModel)]="catalogoEdicion.nombre" name="nombre" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" />
        </div>
        <!-- Descripción -->
        <div class="mb-4">
          <label for="descripcion" class="block text-sm font-medium text-gray-700">Descripción</label>
          <textarea id="descripcion" [(ngModel)]="catalogoEdicion.descripcion" name="descripcion" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></textarea>
        </div>
        <!-- Tipificación -->
        <div class="mb-4">
          <label for="tipificacion" class="block text-sm font-medium text-gray-700">Tipificación</label>
          <select
            id="tipificacion"
            [(ngModel)]="catalogoEdicion.tipificacion.id"
            name="tipificacion"
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"
          >
            <option *ngFor="let tip of tipificaciones" [value]="tip.id">
              {{ tip.nombre }}
            </option>
          </select>
        </div>
        <!-- Botones -->
        <div class="flex justify-end space-x-4">
          <button type="button" (click)="cerrarModal()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">Guardar</button>
        </div>
      </form>
    </div>
  </div>
